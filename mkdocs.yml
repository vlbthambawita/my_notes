site_name: Learning AI, Visually
site_description: AI topics and research papers explained step by step with visualizations
site_author: Vajira Thambawita
site_url: https://vajira.info/my_notes/
repo_url: https://github.com/vlbthambawita/my_notes
repo_name: vlbthambawita/my_notes
edit_uri: edit/main/docs/

exclude_docs: |
  templates/

theme:
  name: material
  icon:
    logo: material/brain
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

extra_css:
  - assets/css/viz.css

extra_javascript:
  - assets/js/mathjax-config.js
  - assets/js/viz-common.js
  - assets/js/diagram.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Topics:
      - Foundations:
          - Gradient Descent: topics/gradient-descent/index.md
      - Reinforcement learning:
          - What is RL?: topics/reinforcement-learning-intro/index.md
  - Papers: papers/index.md
  - Glossary: glossary.md
